<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Plateforme éducative pour les lycéens au Maroc : cours complets, exercices corrigés, examens nationaux et fiches d'orientation post-bac (ENSA, EST, FST, CPGE).">
  <meta name="keywords" content="Cours Maroc, Bac Maroc, 2Bac PC, ENSA, EST, FST, Concours Maroc, Examens Nationaux">
  <meta name="google-signin-client_id" content="555535888410-ebnf10mjbnms6c32fuh6d6nq1ps77ser.apps.googleusercontent.com">

  <!-- Service Worker / Cache Buster -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cours Maroc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cours Maroc - Cours, Examens Corrigés & Orientation Post-Bac</title>
  <link rel="manifest" href="manifest.json">

  <!-- Syncfusion PDF Viewer pdf.js support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script type="text/javascript">
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
  </script>

  <!-- Instant Pre-Flutter Loader Styles -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #f8fafc;
      }
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      z-index: 9999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (prefers-color-scheme: light) {
      #loading-indicator {
        background-color: #f8fafc;
      }
    }
    #loading-indicator.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .cm-brand-badge {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #0f5132 0%, #15803d 50%, #10b981 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 35px rgba(16, 185, 129, 0.3), 0 0 0 1.5px rgba(245, 158, 11, 0.25);
      margin-bottom: 22px;
      animation: cmPulse 2.4s infinite ease-in-out;
    }
    .cm-brand-badge::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 28px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
      z-index: -1;
      animation: cmAura 2.4s infinite ease-in-out;
    }
    .cm-letters {
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
      background: linear-gradient(120deg, #ffffff 30%, #fef08a 60%, #ffffff 90%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: cmShimmer 3s linear infinite;
    }
    .cm-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background-color: #f59e0b;
      border-radius: 50%;
      margin-left: 2px;
      vertical-align: super;
      box-shadow: 0 0 8px #f59e0b;
    }
    .cm-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f1f5f9;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .cm-subtitle {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      margin-bottom: 18px;
    }
    .cm-progress-bar {
      width: 140px;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .cm-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #10b981);
      background-size: 200% 100%;
      border-radius: 10px;
      animation: cmTrack 1.6s infinite ease-in-out;
    }
    @media (prefers-color-scheme: light) {
      .cm-title {
        color: #0f172a;
      }
      .cm-subtitle {
        color: #64748b;
      }
      .cm-progress-bar {
        background: rgba(0, 0, 0, 0.06);
      }
    }
    @keyframes cmPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 35px rgba(16, 185, 129, 0.25), 0 0 0 1.5px rgba(245, 158, 11, 0.2); }
      50% { transform: scale(1.05); box-shadow: 0 16px 45px rgba(16, 185, 129, 0.45), 0 0 0 2px rgba(245, 158, 11, 0.4); }
    }
    @keyframes cmAura {
      0%, 100% { opacity: 0.4; transform: scale(0.96); }
      50% { opacity: 0.85; transform: scale(1.08); }
    }
    @keyframes cmShimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
    @keyframes cmTrack {
      0% { left: -45%; }
      50% { left: 40%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <!-- Instant Branded CM Loader displayed until Flutter engine renders first frame -->
  <div id="loading-indicator">
    <div class="loader-content">
      <div class="cm-brand-badge">
        <span class="cm-letters">CM</span>
      </div>
      <div class="cm-title">Cours Maroc<span class="cm-dot"></span></div>
      <div class="cm-subtitle">Excellence &amp; Réussite • التميز الدراسي</div>
      <div class="cm-progress-bar">
        <div class="cm-progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    function dismissLoader() {
      var loader = document.getElementById('loading-indicator');
      if (loader && !loader.classList.contains('loaded')) {
        loader.classList.add('loaded');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // 1. Listen for Flutter's first painted frame
    window.addEventListener('flutter-first-frame', dismissLoader);

    // 2. Observe Flutter canvas / view attachment as instant fallback
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(dismissLoader, 80);
        obs.disconnect();
      }
    });
    if (document.body) {
      observer.observe(document.body, { childList: true, subtree: true });
    }

    // 3. Fallback safety timer
    setTimeout(dismissLoader, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
