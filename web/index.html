<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Plateforme éducative pour les lycéens au Maroc : cours complets, exercices corrigés, examens nationaux et fiches d'orientation post-bac (ENSA, EST, FST, CPGE).">
  <meta name="keywords" content="Cours Maroc, Bac Maroc, 2Bac PC, ENSA, EST, FST, Concours Maroc, Examens Nationaux">
  <meta name="google-signin-client_id" content="555535888410-ebnf10mjbnms6c32fuh6d6nq1ps77ser.apps.googleusercontent.com">

  <!-- Service Worker / Cache Buster -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Qrayti">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicon & Window Icons (Cache-Busted for instant tab update) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">
  <link rel="icon" type="image/png" href="favicon.png?v=3">

  <title>Qrayti - Cours, Examens Corrigés & Orientation Post-Bac</title>
  <link rel="manifest" href="manifest.json">

  <!-- Syncfusion PDF Viewer pdf.js support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script type="text/javascript">
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
  </script>

  <!-- Instant Luxury Brand Splash (No waiting indicators/bars) -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b1120;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #f8fafc;
      }
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0b1120;
      z-index: 9999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s ease-out;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (prefers-color-scheme: light) {
      #loading-indicator {
        background-color: #f8fafc;
      }
    }
    #loading-indicator.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      animation: splashAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .splash-logo-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-aura {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.28) 0%, rgba(245, 158, 11, 0.15) 45%, transparent 70%);
      z-index: 1;
      animation: auraBreathe 3s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .splash-logo-img {
      position: relative;
      z-index: 2;
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 20px rgba(16, 185, 129, 0.3));
      animation: logoFloat 3s ease-in-out infinite alternate;
    }
    .splash-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
    }
    .splash-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-radius: 50%;
      margin-left: 4px;
      box-shadow: 0 0 10px #f59e0b, 0 0 20px rgba(245, 158, 11, 0.5);
    }
    .splash-subtitle {
      color: #94a3b8;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }
    @media (prefers-color-scheme: light) {
      .splash-logo-img {
        filter: drop-shadow(0 8px 20px rgba(16, 185, 129, 0.25));
      }
      .splash-title {
        color: #0f172a;
        text-shadow: none;
      }
      .splash-subtitle {
        color: #475569;
      }
    }
    @keyframes splashAppear {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes logoFloat {
      0% {
        transform: translateY(0) scale(1);
      }
      100% {
        transform: translateY(-4px) scale(1.02);
      }
    }
    @keyframes auraBreathe {
      0% {
        opacity: 0.5;
        transform: scale(0.95);
      }
      100% {
        opacity: 0.9;
        transform: scale(1.1);
      }
    }
  </style>
</head>
<body>
  <!-- Elegant Brand Splash Screen (No waiting bars or spinners) -->
  <div id="loading-indicator">
    <div class="splash-content">
      <div class="splash-logo-wrapper">
        <div class="splash-aura"></div>
        <img src="icons/Icon-192.png?v=3" alt="Qrayti" class="splash-logo-img" />
      </div>
      <div class="splash-title">Qrayti<span class="splash-dot"></span></div>
      <div class="splash-subtitle">Excellence &amp; Réussite • التميز الدراسي</div>
    </div>
  </div>

  <script>
    function dismissLoader() {
      var loader = document.getElementById('loading-indicator');
      if (loader && !loader.classList.contains('loaded')) {
        loader.classList.add('loaded');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // 1. Listen for Flutter's first painted frame
    window.addEventListener('flutter-first-frame', dismissLoader);

    // 2. Observe Flutter canvas / view attachment as instant fallback
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(dismissLoader, 80);
        obs.disconnect();
      }
    });
    if (document.body) {
      observer.observe(document.body, { childList: true, subtree: true });
    }

    // 3. Fallback safety timer
    setTimeout(dismissLoader, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
