<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="555535888410-ebnf10mjbnms6c32fuh6d6nq1ps77ser.apps.googleusercontent.com">

  <!-- Service Worker / Cache Buster -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cours Maroc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cours Maroc</title>
  <link rel="manifest" href="manifest.json">

  <!-- Syncfusion PDF Viewer pdf.js support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script type="text/javascript">
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
  </script>

  <!-- Instant Pre-Flutter Loader Styles -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #f8fafc;
      }
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      z-index: 9999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (prefers-color-scheme: light) {
      #loading-indicator {
        background-color: #f8fafc;
      }
    }
    #loading-indicator.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .loader-logo {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      margin-bottom: 24px;
      animation: pulse 2.2s infinite ease-in-out;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(16, 185, 129, 0.18);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 14px;
    }
    .loader-text {
      color: #94a3b8;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    @media (prefers-color-scheme: light) {
      .loader-text {
        color: #64748b;
      }
      .loader-logo {
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.92; }
    }
  </style>
</head>
<body>
  <!-- Instant Loading Screen displayed until Flutter engine renders first frame -->
  <div id="loading-indicator">
    <div class="loader-content">
      <img class="loader-logo" src="favicon.png" alt="Cours Maroc" />
      <div class="spinner"></div>
      <div class="loader-text">Chargement de Cours Maroc...</div>
    </div>
  </div>

  <script>
    function dismissLoader() {
      var loader = document.getElementById('loading-indicator');
      if (loader && !loader.classList.contains('loaded')) {
        loader.classList.add('loaded');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // 1. Listen for Flutter's first painted frame
    window.addEventListener('flutter-first-frame', dismissLoader);

    // 2. Observe Flutter canvas / view attachment as instant fallback
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(dismissLoader, 80);
        obs.disconnect();
      }
    });
    if (document.body) {
      observer.observe(document.body, { childList: true, subtree: true });
    }

    // 3. Fallback safety timer
    setTimeout(dismissLoader, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
